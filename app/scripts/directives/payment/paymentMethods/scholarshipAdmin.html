<div class="form-group">
  <label>
    <span translate>Account Type</span>
    <select
      ng-model="currentPayment.scholarship.accountType"
      class="form-control"
    >
      <option value="STAFF" translate>Staff</option>
      <option value="MINISTRY" translate>Ministry</option>
      <option value="NON_US_STAFF" translate>Non-U.S. Staff</option>
    </select>
  </label>
</div>

<div
  class="row form-group"
  ng-show="currentPayment.scholarship.accountType === 'STAFF' || currentPayment.scholarship.accountType === 'NON_US_STAFF'"
>
  <div class="col-sm-12">
    <label>
      <span translate>Account Number</span>
      <div
        class="has-feedback"
        ng-if="currentPayment.scholarship.accountType === 'STAFF'"
      >
        <input
          ng-model="currentPayment.scholarship.accountNumber"
          type="text"
          class="form-control"
          placeholder=""
          uib-typeahead="staff.lastName + ', ' + staff.firstName + ' (' + staff.email + ')' for staff in searchStaff($viewValue)"
          typeahead-on-select="selectStaffAccountNumber($item, 'scholarship')"
          typeahead-loading="loadingAccountNumber"
          typeahead-wait-ms="300"
        />
        <span
          class="form-control-feedback"
          title="Searching..."
          ng-if="loadingAccountNumber"
        >
          <i class="fa fa-spinner fa-spin"></i>
        </span>
      </div>
      <input
        ng-if="currentPayment.scholarship.accountType !== 'STAFF'"
        ng-model="currentPayment.scholarship.accountNumber"
        type="text"
        class="form-control"
      />
      <div
        id="staff-account-lookup-error-{{$id}}"
        class="text-danger"
        ng-if="staffAccountLookupMessage"
        role="alert"
      >
        {{staffAccountLookupMessage}}
      </div>
    </label>
  </div>
</div>

<div
  class="row form-group"
  ng-show="currentPayment.scholarship.accountType === 'MINISTRY'"
>
  <div class="col-sm-3 stacked-spacing-col-sm">
    <label>
      <span translate>Business Unit</span>
      <input
        ng-model="currentPayment.scholarship.businessUnit"
        type="text"
        class="form-control"
      />
    </label>
  </div>

  <div class="col-sm-3 stacked-spacing-col-sm">
    <label>
      <span translate>Operating Unit</span>
      <input
        ng-model="currentPayment.scholarship.operatingUnit"
        type="text"
        class="form-control"
      />
    </label>
  </div>

  <div class="col-sm-3 stacked-spacing-col-sm">
    <label>
      <span translate>Department</span>
      <input
        ng-model="currentPayment.scholarship.department"
        type="text"
        class="form-control"
      />
    </label>
  </div>

  <div class="col-sm-3">
    <label>
      <span translate>Project Id</span>
      <i
        class="fa fa-question-circle"
        button
        uib-popover="{{'If there is no Project Id (or `NONE`), leave blank' | translate}}"
        popover-trigger="'mouseenter'"
        popover-append-to-body="true"
      >
      </i>
      <input
        ng-model="currentPayment.scholarship.projectId"
        type="text"
        class="form-control"
      />
    </label>
  </div>
</div>
