# agent-review configuration (v2)
#
# Lives at `.claude/review/config.yml` in the repo being reviewed.
# Validate any edit with: `agent-review config validate`
#
# Generated by `/agent-review:init` from a scan of this repo and 200 merged PRs
# (#765 to #1017). Edit by hand as the team learns; the rule docs in rules/ are
# plain prose.

version: 2

# Global severity/verbosity dial.
# chill     → fewer, high-confidence findings; raises the consensus threshold
# standard  → default behavior
# assertive → more findings, lower threshold, may be nitpicky
profile: standard

# Branch every review diffs against unless `--base` is passed.
base_branch: master

# ── Risk scoring ──────────────────────────────────────────────────────────────
risk:
  # File-pattern contributions. `tier` is descriptive; `points` drives the score.
  # Per file, the highest-scoring matching pattern wins (patterns don't stack on
  # one file; files sum across the diff). A file that matches no pattern gets
  # `unmatched_file_points` (below), so a 0-point entry lowers its files to 0.
  # A push that touches only 0-point and excluded paths, in a small diff, scores
  # 0: auto mode skips its review and the earlier report stands. Give 0 points
  # only to files no review needs to see; `excluded_paths` keeps a path out
  # entirely.
  #
  # Note: specs that live inside a 2-point folder (app/scripts/services/*.spec.js,
  # app/scripts/directives/**/*.spec.js) score 2, because the folder pattern is
  # higher than the test pattern and the highest match wins.
  patterns:
    # Critical: CI, build and deploy
    - { glob: '.github/workflows/**', points: 3, tier: critical }
    - { glob: 'webpack.config.js', points: 3, tier: critical }
    - { glob: 'Dockerfile', points: 3, tier: critical }
    - { glob: '.dockerignore', points: 3, tier: critical }
    - { glob: 'build.sh', points: 3, tier: critical }
    # Critical: auth, session, routing and environment selection
    - { glob: 'app/scripts/app.config.js', points: 3, tier: critical }
    - { glob: 'app/scripts/app_enforceAuth.js', points: 3, tier: critical }
    - {
        glob: 'app/scripts/services/*Interceptor.js',
        points: 3,
        tier: critical,
      }
    - {
        glob: 'app/scripts/services/{loginDialog,logout,PermissionCache,ProfileCache,staffLoginWarning}.js',
        points: 3,
        tier: critical,
      }
    - {
        glob: 'app/scripts/components/GoogleLogin/**',
        points: 3,
        tier: critical,
      }
    - {
        glob: 'app/scripts/utils/{hostEnvironment.ts,hostnames.json}',
        points: 3,
        tier: critical,
      }
    - { glob: 'app/index.ejs', points: 3, tier: critical }
    # Critical: card data (TSYS tokenization and the card form)
    - { glob: 'app/scripts/services/payment.js', points: 3, tier: critical }
    - { glob: 'app/scripts/directives/payment/**', points: 3, tier: critical }
    # Critical: the review harness itself (weakening it weakens every review)
    - { glob: '.claude/review/config.yml', points: 3, tier: critical }
    - {
        glob: '.claude/review/learnings/learnings.yml',
        points: 3,
        tier: critical,
      }
    - { glob: '.claude/review/static/**', points: 3, tier: critical }
    - { glob: '.claude/settings.json', points: 2, tier: high }
    - { glob: '.claude/review/**', points: 2, tier: high }
    # High: money and finance features
    - {
        glob: 'app/features/{paymentModal,paymentApproval,paymentCashCheckReport,journalUploadReview,globalPromotions,reviewRegistration}/**',
        points: 2,
        tier: high,
      }
    - {
        glob: 'app/scripts/services/{paymentReportService.js,journalUploadService.ts,promoReportService.ts,globalPromotionService.ts,staffAccountService.js}',
        points: 2,
        tier: high,
      }
    - {
        glob: 'app/scripts/filters/{localizedCurrency,paymentTypeFormat}.js',
        points: 2,
        tier: high,
      }
    - {
        glob: 'app/scripts/components/{JournalUploadPage,PromoUploadPage,TransactionsTable,JournalTransactionsTable,PromoTransactionsTable,ExportModal}/**',
        points: 2,
        tier: high,
      }
    # High: shared cross-feature code (hotfix-prone: blocks, datepicker, validateRegistrant)
    - { glob: 'app/scripts/services/**', points: 2, tier: high }
    - { glob: 'app/scripts/directives/**', points: 2, tier: high }
    - { glob: 'app/scripts/utils/**', points: 2, tier: high }
    - { glob: 'app/scripts/hooks/**', points: 2, tier: high }
    - { glob: 'app/scripts/*.js', points: 2, tier: high }
    - {
        glob: 'app/features/{registration,eventForm,eventDetails}/**',
        points: 2,
        tier: high,
      }
    - { glob: 'types/**', points: 2, tier: high }
    - { glob: 'package.json', points: 2, tier: high }
    - {
        glob: '{babel.config.js,babel-angular.config.js,tsconfig.json,karma.conf.js,jest.config.js,next.config.js}',
        points: 2,
        tier: high,
      }
    # Medium: ordinary source
    - { glob: 'app/**/*.{js,ts,tsx,html}', points: 1, tier: medium }
    - { glob: 'app/styles/**', points: 1, tier: medium }
    - { glob: 'pages/**', points: 1, tier: medium }
    # Tests score 1, so a push that only changes tests still gets a quick review.
    - { glob: '**/*.test.*', points: 1, tier: low }
    - { glob: '**/*.spec.js', points: 1, tier: low }
    - { glob: '{__tests__,test}/**', points: 1, tier: low }
    - { glob: '**/*.snap', points: 0, tier: low }

  # Unknown paths are not zero-risk. Each non-excluded file that matches none of
  # the patterns above gets this many points, preventing a newly introduced
  # directory from being silently skipped by auto mode. Set to 0 only if your
  # pattern map is intentionally exhaustive.
  unmatched_file_points: 1

  # Dependency manifests and lockfiles, used by the special detections below.
  manifests: ['package.json']
  lockfiles: ['yarn.lock']

  # Change-volume → points (lines changed across the diff).
  volume_multiplier:
    - { upTo: 50, points: 0 }
    - { upTo: 200, points: 1 }
    - { upTo: 500, points: 2 }
    - { upTo: 1000, points: 3 }
    - { upTo: null, points: 4 } # 1000+

  # Scope multiplier applied to the pattern+volume subtotal.
  scope_multiplier:
    single_file: 1.0
    single_feature: 1.0
    multi_feature: 1.3
    cross_cutting: 1.7
    core_infra: 2.0

  # Special detections. Entries with empty `paths`/`files`/`packages` never fire —
  # fill them in to enable the detection.
  special:
    - { when: new_dependency, points: 2 }
    # Framework, runtime, payment, error-tracking and UI packages. react-bootstrap
    # is here because a 2.x bump broke the upload pages (PR #879, reverted in #883).
    - {
        when: critical_pkg_update,
        points: 3,
        packages:
          [
            angular,
            angular-route,
            angular-sanitize,
            angular-cookies,
            angular-ui-bootstrap,
            angular-gettext,
            react,
            react-dom,
            react2angular,
            angular2react,
            react-bootstrap,
            bootstrap-sass,
            next,
            '@cruglobal/cru-payments',
            rollbar,
            typescript,
            webpack,
            moment,
            moment-timezone,
            lodash,
          ],
      }
    - { when: lockfile_only_change, points: 1 }
    # This is a browser app with no database, so there are no migrations.
    - { when: migration_change, points: 3, paths: [] }
    # `files` = security-relevant config files (framework config, CSP/header
    # config); `keywords` = diff text that signals a security-relevant edit.
    - {
        when: config_security_change,
        points: 2,
        files:
          [
            webpack.config.js,
            next.config.js,
            app/index.ejs,
            Dockerfile,
            .dockerignore,
            netlify.toml,
            app/.htaccess,
          ],
        keywords:
          [
            headers,
            content-security,
            csp,
            redirects,
            rewrites,
            domains,
            integrity,
            devtool,
          ],
      }

  # Score → risk level + required reviewer.
  levels:
    - { range: [0, 3], level: LOW, reviewer: entry }
    - { range: [4, 6], level: MEDIUM, reviewer: entry }
    - { range: [7, 9], level: HIGH, reviewer: experienced }
    - { range: [10, null], level: CRITICAL, reviewer: 'senior maintainer' }

# ── Agents ────────────────────────────────────────────────────────────────────
# `always: true` runs the agent on every review. Otherwise the agent runs only
# when a changed file matches `triggers.paths` or the diff contains one of
# `triggers.content`. A content trigger matches whole identifiers only
# (`currency` never fires on `concurrency`); a trailing `_` makes it a prefix
# (`OKTA_`) and a leading `_` a suffix (`__c`). `rules[]` paths resolve against `.claude/review/`.
# `triggers.specials` (optional) does NOT trigger the agent — it only records
# which risk.special[].when detections this lane owns, so loadConfig's
# `escalates` default can still find the right lane if you rename/remove the
# security/data-integrity/architecture ids below.
# `model` picks the review tier: an explicit `model:` (opus/sonnet/haiku) is
# honored in every review mode; `smart` lanes are the ones quick mode may
# downgrade to haiku, and only when `escalates` is false.
# WARNING: the engine honors this operator override — explicitly setting `escalates: false` on
# the security lane below removes it from the escalating-lane coverage guarantee (an unmatched
# reviewable file no longer force-includes a lane that actually escalates to opus). The engine
# still force-includes `security` by id when NO lane escalates at all, so coverage never silently
# vanishes — but if every lane's `escalates` is set to false, that forced lane won't actually
# escalate either. De-escalating every lane disables coverage escalation entirely: an unmatched
# reviewable file will still get a lane, but never one that reads at opus rigor.
agents:
  - id: security
    title: Security Review Agent
    expertise: Authentication, authorization, data protection, vulnerability detection, secure coding.
    enabled: true
    model: smart # smart | opus | sonnet | haiku
    always: false
    escalates: true # deserves Opus on HIGH/CRITICAL PRs
    triggers:
      paths:
        - 'app/scripts/app.config.js'
        - 'app/scripts/app_enforceAuth.js'
        - 'app/scripts/services/*Interceptor.js'
        - 'app/scripts/services/{loginDialog,logout,PermissionCache,ProfileCache,staffLoginWarning,modalMessage}.js'
        - 'app/scripts/services/{genericModal,confirmModal}.html'
        - 'app/scripts/components/GoogleLogin/**'
        - 'app/scripts/components/ExportModal/**'
        - 'app/scripts/utils/{hostEnvironment.ts,hostnames.json}'
        - 'app/scripts/{errorNotify,exceptionHandler}.js'
        - 'app/scripts/filters/toTrustedHtml.js'
        - 'app/scripts/services/payment.js'
        - 'app/scripts/directives/payment/**'
        - 'app/index.ejs'
        - 'webpack.config.js'
        - 'Dockerfile'
        - '.dockerignore'
        - 'build.sh'
        - '.github/workflows/**'
      # dangerouslySetInnerHTML has no use in the repo today; it is here to catch
      # the first one.
      content:
        - crsToken
        - crsAuthProviderType
        - '$cookies'
        - ng-bind-html
        - toTrustedHtml
        - trustAsHtml
        - dangerouslySetInnerHTML
        - '$window.location'
        - window.location
        - intendedRoute
        - auth_error
        - requireLogin
        - permissionInt
        - Authorization
        - ROLLBAR_
        - scrubFields
        - tsysEnvironment
        - envService
    rules: ['rules/security.md']

  - id: architecture
    title: Architecture Review Agent
    expertise: System design, patterns, technical debt, maintainability, scalability.
    enabled: true
    always: true
    escalates: true # deserves Opus on HIGH/CRITICAL PRs
    rules: ['rules/architecture.md']

  - id: data-integrity
    title: Data Integrity Review Agent
    expertise: Data flow, persistence, caching, input validation, type safety, data consistency.
    enabled: true
    always: false
    escalates: true # deserves Opus on HIGH/CRITICAL PRs
    triggers:
      paths:
        - 'app/scripts/services/**'
        - 'app/scripts/hooks/**'
        - 'types/**'
        - 'app/features/{eventForm,eventDetails}/**'
        - 'app/scripts/directives/{blocks,datepicker,blockRegistration}/**'
        - 'app/scripts/components/ExportModal/**'
        - 'test/spec/testData.spec.js'
      content:
        - '$http'
        - ConfCache
        - RegistrationCache
        - ProfileCache
        - MinistriesCache
        - '$cacheFactory'
        - angular.copy
        - registrationPages
        - allowedRegistrantTypeSet
        - allCountries
        - globalUser
        - 'moment('
        - ng-model-options
    rules: ['rules/data-integrity.md']

  - id: testing
    title: Testing & Quality Review Agent
    expertise: Test coverage, test quality, edge cases, error handling, code quality.
    enabled: true
    always: true
    rules: ['rules/testing.md']

  - id: standards
    title: Standards Compliance Review Agent
    expertise: Project-specific coding standards, patterns, and conventions.
    enabled: true
    always: true
    rules: ['rules/standards.md']

  # ── Repo specialists ────────────────────────────────────────────────────────
  - id: financial
    title: Financial & Payments Review Agent
    expertise: Card tokenization through TSYS, payment amounts and validation, refunds, currency display, promotions and global promotions, gift cards, scholarships, staff account transfers, and journal and promo uploads.
    enabled: true
    always: false
    escalates: true # owns the card-data path; deserves Opus on HIGH/CRITICAL PRs
    triggers:
      paths:
        - 'app/scripts/services/{payment,paymentReportService,staffAccountService}.js'
        - 'app/scripts/services/{journalUploadService,promoReportService,globalPromotionService}.ts'
        - 'app/scripts/directives/{payment,promotion,staffAccountSearch,staffAccountNotice}/**'
        - 'app/scripts/filters/{localizedCurrency,paymentTypeFormat}.js'
        - 'app/features/{paymentModal,paymentApproval,paymentCashCheckReport,journalUploadReview,globalPromotions,reviewRegistration}/**'
        - 'app/features/eventDetails/{paymentOptions,promotions}.html'
        - 'app/scripts/components/{JournalUploadPage,PromoUploadPage,TransactionsTable,JournalTransactionsTable,PromoTransactionsTable}/**'
        - 'app/scripts/hooks/{useAccountTransfers,usePaymentsModal,usePromoReport,usePromoReports,usePromoRegistrationList}.ts'
        - 'app/scripts/utils/wtrSave50Promo.js'
      content:
        - amount
        - currencyCode
        - localizedCurrency
        - paymentType
        - remainingBalance
        - calculatedTotalDue
        - calculatedMinimumDeposit
        - paymentCharged
        - tsepToken
        - cruPayments
        - creditCard
        - giftCard
        - FL_GIFT_CARD
        - scholarship
        - accountTransfer
        - staffAccountNumber
        - isPromotionActive
        - globalPromotions
    rules: ['rules/financial.md']

  - id: registration-rules
    title: Registration Rules Review Agent
    expertise: Event open, closed and full state, event and registrant-type capacity with exempt types, couple and spouse pairs, registrant type selection and limits, question visibility rules and hidden questions, and the register, review and complete flow.
    enabled: true
    always: false
    triggers:
      paths:
        - 'app/scripts/utils/{conferenceLimits.ts,coupleTypeUtils.js}'
        - 'app/scripts/services/{validateRegistrant,RegistrationCache,registration,currentRegistrationInterceptor}.js'
        - 'app/scripts/directives/{blocks,blockRegistration,blockEditor,rule,registrationTypeSelect,showGroupModal,questionToolbar,page}/**'
        - 'app/scripts/filters/showQuestionFilter.js'
        - 'app/features/{registration,reviewRegistration,registrationModal,editRegistrationModal,eventForm,landing,eventOverview}/**'
        - 'app/features/eventDetails/{regTypes,eventInformation,regOptions}.html'
      content:
        - availableCapacity
        - useTotalCapacity
        - exemptFromConferenceCapacity
        - manuallyClosed
        - useLimit
        - availableSlots
        - numberOfChildRegistrants
        - allowedRegistrantTypeSet
        - defaultTypeKey
        - isCoupleType
        - findCoupleForSpouse
        - findSpouseForCouple
        - blockVisible
        - shouldShowForRegistrantType
        - parentBlockId
        - validPages
    rules: ['rules/registration-rules.md']

  - id: i18n
    title: Internationalization Review Agent
    expertise: angular-gettext marking of user-facing text in templates and JS, extractable msgids, sentences kept whole, and text that the extractor cannot see (TS, TSX, JSX).
    enabled: true
    always: false
    triggers:
      paths:
        - 'app/**/*.html'
        - 'app/index.ejs'
        - 'languages/**'
      content:
        - translate
        - gettextCatalog
        - gettext
        - aria-label
        - placeholder
        - uib-popover
    rules: ['rules/i18n.md']

  - id: accessibility
    title: Accessibility Review Agent
    expertise: Labels and accessible names, fieldsets and legends, ARIA ids, heading order, keyboard access and native buttons, and focus in AngularJS templates and React components.
    enabled: true
    always: false
    triggers:
      paths:
        - 'app/**/*.html'
        - 'app/index.ejs'
        - 'app/scripts/components/**/*.tsx'
      content:
        - 'aria-'
        - 'role='
        - tabindex
        - sr-only
        - '<label'
        - '<fieldset'
        - ng-click
        - onClick
        - popover-trigger
    rules: ['rules/accessibility.md']

  # Novel lane (not from the standard specialist table): the hybrid seam.
  - id: angular-react-bridge
    title: AngularJS/React Bridge Review Agent
    expertise: react2angular and angular2react wrappers, injectables passed as React props, IPromise versus native Promise, digest timing and $apply, and $rootScope state shared between AngularJS and React.
    enabled: true
    always: false
    triggers:
      paths:
        - 'app/scripts/components/**'
        - 'app/scripts/hooks/**'
        - 'pages/**'
        - 'app/scripts/main-next.js'
        - 'types/injectables.ts'
      content:
        - react2angular
        - angular2react
        - IPromise
        - ngimport
        - '$apply'
        - Promise.resolve
        - new Promise
        - '@ts-ignore'
    rules: ['rules/angular-react-bridge.md']

  # Advisory lane: rules/simplification.md caps pure cleanups below the blocker
  # threshold and requires cited proof for every reuse claim. Keep this entry
  # LAST — quick mode's third slot takes the first plan entry after
  # testing/standards, and it must never land on this lane. Costs one extra
  # smart-tier lane per standard/deep review; set `enabled: false` to opt out.
  - id: simplification
    title: Simplification & Reuse Review Agent
    expertise: Code reuse, duplication, unnecessary abstraction, dead weight, wasteful computation on real data paths.
    enabled: true
    always: true
    rules: ['rules/simplification.md']

# ── Per-path rules ────────────────────────────────────────────────────────────
# Extra rule docs applied to EVERY agent reviewing a matching file.
# Example: - { paths: ['<ui-components>/**'], rules: ['rules/ux.md'] }
path_rules: []

# ── Exclusions — never reviewed, never scored ─────────────────────────────────
excluded_paths:
  - '**/*.snap'
  - '**/*.generated.*'
  - 'docs/**'
  - '.claude/review/rules/**' # prose rule docs — config/guidance, not reviewable code
  # agent-review's own bookkeeping, never reviewed or scored: /agent-review:address commits
  # a new learnings/feedback/ file to PRs (older plugins wrote feedback.jsonl), and reviews write
  # metrics/, the index cache, and the learning loop's local scratch (learnings/pending/ and
  # learnings/findings.json).
  - '.claude/review/learnings/feedback.jsonl'
  - '.claude/review/learnings/feedback/**'
  - '.claude/review/metrics/**'
  - '.claude/review/index/**'
  - '.claude/review/learnings/pending/**'
  - '.claude/review/learnings/findings.json'
  # Seeded-bug evaluation patches contain bugs on purpose; results are run output.
  - '.claude/review/evals/patches/**'
  - '.claude/review/evals/results/**'
  # Package-manager artifacts — generated/vendored, never reviewable
  - 'yarn.lock'
  - 'package-lock.json'
  - 'pnpm-lock.yaml'
  - '.yarn/**'
  # Build output, coverage, generated translation template, and images
  - 'dist/**'
  - 'coverage/**'
  - '.next/**'
  - 'next-env.d.ts'
  - 'languages/ert.pot'
  - 'app/img/**'

# ── Deterministic evidence ────────────────────────────────────────────────────
# ast-grep runs trusted, repo-authored AST rules before the model. Only matches
# on added lines become ledger findings. Rules and their tests live in
# static/ (run: npx -p @ast-grep/cli@0.45.0 ast-grep test --config .claude/review/static/sgconfig.yml --skip-snapshot-tests).
static_analysis:
  ast_grep:
    enabled: true
    config: static/sgconfig.yml
    version: 0.45.0 # pin the CI binary; do not use "latest"
    severity: { error: 8, warning: 6, info: 4, hint: 2 }
    excluded_paths: []

# Snapshot existing GitHub checks and their annotations into the review prompt.
# This does not replace branch protection and does not turn a flaky test into a
# model-authored blocker. Meaningful checks here: Tests, ESLint, TypeScript,
# Prettier, Build app, and Codecov.
ci:
  enabled: true
  ignore_checks: []

# Optional SHA-pinned API/client/documentation repositories. Enable only after
# creating context/repositories.json; cross-repo private access requires the
# optional context_token secret in the consumer workflow.
context:
  enabled: false
  manifest: context/repositories.json

# Review engine: agent-review (the default) | code-review. Leave this block out for
# agent-review. Uncomment it only for code-review: plugin 1.0.0 cannot load a config that has it.
# code_review keys: effort low|medium|high|xhigh|max, model opus|sonnet|haiku,
# replaces and always are lists of agent ids; max_findings is optional (an integer >= 1 or all).
# engine:
#   name: code-review
#   code_review:
#     effort: xhigh
#     model: opus
#     replaces: [architecture, simplification]
#     always: [security, testing, standards]
#     # max_findings: 15   # optional; leave out to use /code-review's own cap

# Where reviews run: local | local-and-ci (the default). Leave this key out for local-and-ci.
# Uncomment it only for local: plugin 1.0.0 cannot load a config that has it.
reviews_run: local

# People-only approval. The bot never approves a PR that needs a person. Leave this block out
# unless the repo sets it; both keys are optional (always defaults to false, paths to []).
human_approval:
  paths:
    # Card data: TSYS tokenization, the card form, the admin card path, the gateway setting,
    # and the files that decide which hosts get the production API and production TSYS.
    - 'app/scripts/services/payment.js'
    - 'app/scripts/directives/payment/**'
    - 'app/features/eventDetails/paymentOptions.html'
    - 'app/features/paymentModal/paymentModal.controller.js'
    - 'app/scripts/utils/{hostEnvironment.ts,hostnames.json}'
    # CI, build and deploy, and the review harness itself. A writer can post their own
    # report, so without these a change that weakens review or deploy could be bot-approved.
    - '.github/workflows/**'
    - 'webpack.config.js'
    - 'Dockerfile'
    - '.dockerignore'
    - 'build.sh'
    - '.claude/settings.json'
    - '.claude/review/config.yml'
    - '.claude/review/learnings/learnings.yml'
    - '.claude/review/static/**'

# Reports approve by default (`advisory`). Set `shadow` to post advice only; the
# review workflow refuses a caller whose rollout_mode disagrees with this value,
# so change the caller templates and this key together. `agent-review rollout`
# still scores the seeded suite and dismissal telemetry for teams that want the
# gate before turning approval on.
rollout:
  mode: advisory
  label: agent-review
  minimum_evaluated_runs: 50
  minimum_dispositions: 30
  thresholds:
    dismissal_rate: 0.35
    false_positive_dismissal_rate: 0.20

# ── Index layer: file-level import graph for impact analysis ──────────────────
# Limits in this repo: AngularJS services, directives and filters are injected by
# name, not imported, so the graph misses most AngularJS dependents (main.js
# imports every file). Imports from types/ use bare names ('conference') and are
# not traced. The graph is most useful for the TS/React code.
index:
  enabled: true
  path: '.claude/review/index'
  roots: ['app', 'pages', 'types', '__tests__', 'test']
  aliases:
    - { prefix: 'scripts/', target: 'app/scripts/' }
    - { prefix: 'features/', target: 'app/features/' }
  extensions: ['.ts', '.tsx', '.d.ts', '.js', '.json', '.html']

# ── Learning layer: approval-gated feedback loop ──────────────────────────────
learning:
  enabled: true
  path: '.claude/review/learnings'
  approval_required: true # not yet enforced — reserved; promotion is always approval-gated today
  min_support: 3
  scope: local # not yet enforced — reserved (local | shared)

enforcement:
  mode: warn # warn | block — reserved for future merge-gating
