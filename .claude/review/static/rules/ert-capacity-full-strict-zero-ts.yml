id: ert-capacity-full-strict-zero-ts
language: TypeScript
severity: error
message: Comparing availableCapacity to 0 with === or !== misses negative capacity, so a full event looks open.
note: >-
  Admins can add registrants past the limit, which pushes availableCapacity below zero.
  Use `availableCapacity <= 0` for full and `availableCapacity > 0` for open, or better, one shared
  helper in app/scripts/utils/conferenceLimits.ts. Mined from PRs #936, #953, #955, #956.
rule:
  any:
    - pattern: $X.availableCapacity === 0
    - pattern: $X.availableCapacity == 0
    - pattern: 0 === $X.availableCapacity
    - pattern: 0 == $X.availableCapacity
    - pattern: $X.availableCapacity !== 0
    - pattern: $X.availableCapacity != 0
    - pattern: 0 !== $X.availableCapacity
    - pattern: 0 != $X.availableCapacity
