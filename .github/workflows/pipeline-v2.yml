# Pipeline v2: build once, then promote the same build.
#
# Builds run nightly and on demand, never on push. The nightly run builds the
# tip of the default branch. If that commit was built already, the build
# reuses its candidate, and the release-candidate deploy does nothing when
# that candidate is already live, so a quiet night changes nothing. A manual
# run works the same way.
#
# Every v2 app builds in the same nightly slot, 05:00 UTC (midnight EST, 1am
# EDT). It is a quiet time on GitHub's scheduler, but a scheduled run can
# still start a few minutes late.
#
# The reusable workflow and the actions are pinned to the released v2 tag of
# CruGlobal/.github, and workflow-ref: v2 makes the actions it checks out
# match. v2 follows the latest v2.x release. The static type needs 2.17.0 or
# later.
name: Pipeline v2

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

# No job gets the default GITHUB_TOKEN permissions. The build sets its own
# below, and the deploy job dispatches with its own token.
permissions: {}

jobs:
  build:
    name: Build candidate
    uses: CruGlobal/.github/.github/workflows/build-candidate.yml@v2
    # The build signs in to AWS with OIDC, so the caller must grant
    # id-token: write. A reusable workflow can only lower the caller's
    # permissions, never raise them.
    permissions:
      id-token: write
      contents: read
    with:
      workflow-ref: v2
      type: static
    # Build-time secrets are repo secrets named BUILD_<NAME>. inherit hands
    # them to the reusable workflow, which passes only the BUILD_* ones to
    # build.sh, with the prefix removed.
    secrets: inherit

  deploy-release-candidate:
    name: Deploy to release-candidate
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: CruGlobal/.github/actions/dispatch@v2
        with:
          github-token: ${{ secrets.CRU_DEPLOY_GITHUB_TOKEN }}
          workflow: deploy-candidate.yml
          inputs-json: >-
            {"project-name": "${{ needs.build.outputs.project-name }}",
             "tag": "${{ needs.build.outputs.candidate }}"}
